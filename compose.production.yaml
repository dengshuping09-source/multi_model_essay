name: wenheng

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: wenheng-backend:local
    restart: unless-stopped
    env_file:
      - ${WENHENG_ENV_FILE:-./deploy/production.env}
    environment:
      APP_ENV: production
      UPLOAD_DIR: /app/storage/uploads
      PADDLE_PDX_CACHE_HOME: /app/.cache/paddlex
    expose:
      - "8000"
    volumes:
      - wenheng_storage:/app/storage
      - wenheng_paddlex_cache:/app/.cache/paddlex
    networks:
      - wenheng_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: wenheng-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-18080}:80"
    networks:
      - wenheng_internal

networks:
  wenheng_internal:
    driver: bridge

volumes:
  wenheng_storage:
    name: wenheng_storage
  wenheng_paddlex_cache:
    name: wenheng_paddlex_cache
